name: Atlas source audit

on:
  push:
    branches:
      - feat/atlas-idhm-componentes
    paths:
      - .github/workflows/atlas-source-audit.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Download and inspect official Atlas workbook
        run: |
          python - <<'PY'
          import json, urllib.request
          from openpyxl import load_workbook
          url="https://atlasbrasil.org.br/cockpit/storage/uploads/dados/censo_total_1991_2010.xlsx"
          path="/tmp/censo_total_1991_2010.xlsx"
          urllib.request.urlretrieve(url,path)
          wb=load_workbook(path,read_only=True,data_only=True)
          print("SHEETS", wb.sheetnames)
          for ws in wb.worksheets:
              print("SHEET",ws.title,"ROWS",ws.max_row,"COLS",ws.max_column)
              rows=ws.iter_rows(values_only=True)
              header=next(rows)
              print("HEADER",json.dumps(list(header),ensure_ascii=False))
              wanted={"Codmun7","ANO","IDHM","IDHM_E","IDHM_L","IDHM_R"}
              idx={str(v):i for i,v in enumerate(header) if v is not None}
              if wanted.issubset(idx):
                  print("MATCH_COLUMNS",json.dumps({k:idx[k] for k in sorted(wanted)},ensure_ascii=False))
                  samples=[]
                  for row in rows:
                      if str(row[idx["Codmun7"]]) in {"3509502","3525904","3536505"}:
                          samples.append({k:row[idx[k]] for k in sorted(wanted)})
                  print("SAMPLES",json.dumps(samples,ensure_ascii=False))
          PY
