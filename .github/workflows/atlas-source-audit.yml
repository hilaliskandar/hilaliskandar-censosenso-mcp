name: Atlas source audit

on:
  push:
    branches:
      - feat/atlas-idhm-componentes
    paths:
      - .github/workflows/atlas-source-audit.yml
      - scripts/update-atlas-idhm.py

permissions:
  contents: write

jobs:
  inspect-and-generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/atlas-idhm-componentes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Generate audited Atlas snapshot
        env:
          ATLAS_INSECURE_TLS: "1"
        run: python scripts/update-atlas-idhm.py
      - name: Validate sample
        run: |
          python - <<'PY'
          import json
          p=json.load(open("src/data/atlas-idhm-municipios-1991-2010.json",encoding="utf-8"))
          for code in ["3509502","3525904","3536505"]:
              print(code, json.dumps(p["municipalities"][code], ensure_ascii=False))
          PY
      - name: Commit generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/atlas-idhm-municipios-1991-2010.json
          git diff --cached --quiet && exit 0
          git commit -m "data(atlas): atualizar snapshot municipal do IDHM"
          git push origin HEAD:feat/atlas-idhm-componentes
