name: Generate 0.7.0 surface baseline

on:
  push:
    branches:
      - release/0.7.0-map-surface
    paths:
      - .github/workflows/generate-070-baseline.yml

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.7.0-map-surface
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/dump-surface.mjs --stdio > baselines/surface-stdio-0.7.0.json
      - run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('baselines/surface-stdio-0.7.0.json','utf8')); if(x.toolCount!==24||!x.tools.some(t=>t.name==='ibge_mapa')) process.exit(1); console.log('baseline ok:',x.toolCount,'tools')"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baselines/surface-stdio-0.7.0.json
          git diff --cached --quiet && exit 0
          git commit -m "release: gerar baseline de superfície 0.7.0"
          git push origin HEAD:release/0.7.0-map-surface
