name: Format preview

on:
  pull_request:
    branches: [main]

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prettier diff
        run: |
          npx prettier --write src/tools/cidades.ts
          git diff -- src/tools/cidades.ts
