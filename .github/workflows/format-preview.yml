name: Format preview

on:
  push:
    branches:
      - feat/0.7-ibge-mapa-coropletico
    paths:
      - .github/workflows/format-preview.yml

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write src/tools/mapa.ts
          git diff -- src/tools/mapa.ts
