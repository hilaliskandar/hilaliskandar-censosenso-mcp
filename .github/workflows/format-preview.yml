name: Format apply

on:
  push:
    branches:
      - feat/0.7-ibge-mapa-coropletico
    paths:
      - .github/workflows/format-preview.yml

permissions:
  contents: write

jobs:
  prettier-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/0.7-ibge-mapa-coropletico
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/tools/mapa.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/mapa.ts
          git diff --cached --quiet && exit 0
          git commit -m "style(mapa): aplicar Prettier"
          git push origin HEAD:feat/0.7-ibge-mapa-coropletico
